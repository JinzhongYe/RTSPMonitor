name: Publish v0.5.0
on: workflow_dispatch
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: JinzhongYe/RTSPMonitor
      DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
    steps:
      - uses: actions/checkout@v4
      - name: Publish verified build
        run: |
          test "$(gh api repos/$GH_REPO/actions/runs/41995185138 --jq .conclusion)" = success
          gh run download 41995185138 --name RTSPMonitor-0.5.0 --dir dist
          cd dist && sha256sum --check SHA256SUMS.txt && cd ..
          printf '%s' "$DEBUG_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/rtsp-debug.keystore"
          rtsp_signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$rtsp_signer" sign --ks "$RUNNER_TEMP/rtsp-debug.keystore" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --v4-signing-enabled false dist/RTSPMonitor-0.5.0-debug.apk
          "$rtsp_signer" verify --print-certs dist/RTSPMonitor-0.5.0-debug.apk > dist/apk-signature.txt
          grep -qi ff51a90e4557e7cf86f3e19b771a4c432d7e5969317cedf7e3d001ae7f9597d3 dist/apk-signature.txt
          cd dist && sha256sum *.apk > SHA256SUMS.txt && cd ..
          if gh release view v0.5.0 > /dev/null 2>&1; then
            gh release upload v0.5.0 dist/* --clobber
          else
            gh release create v0.5.0 dist/* --target cc33a0ad9ba04c1674ff79929fbf763c97a8efa0 --title 'v0.5.0 - 自动监控与相册导出' --prerelease --notes-file docs/RELEASE_NOTES_0.5.0.md
          fi
